[tool.poetry]
name = "bidding_ai"
version = "0.1.0"
description = "A bridge bidding assistant."
authors = ["SillyKaka <you@example.com>"]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = "^0.68.0"
uvicorn = {extras = ["standard"], version = "^0.15.0"}
pydantic = "^1.8.0"
httpx = "^0.19.0"

[tool.poetry.dev-dependencies]
pytest = "^6.2.5"
ruff = "^0.0.227"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"